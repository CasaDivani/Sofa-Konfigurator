<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Sofa-Konfigurator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e4e2dd;--panel:#f2f0ec;--ink:#24231f;--mute:#76736b;--line:#d3cfc6;--acc:#56633f;--accink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--panel:#22211e;--ink:#ecebe6;--mute:#9b978d;--line:#38362f;--acc:#9fb27a;--accink:#14150f}}
:root[data-theme="dark"]{--bg:#171715;--panel:#22211e;--ink:#ecebe6;--mute:#9b978d;--line:#38362f;--acc:#9fb27a;--accink:#14150f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 'Hanken Grotesk',system-ui,sans-serif}
.app{display:grid;grid-template-columns:268px minmax(0,1fr) 304px;gap:14px;padding:14px;min-height:100vh;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
h1{font-size:18px;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
h2{font-size:13px;margin:18px 0 8px;font-weight:700}
.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:16px 10px;text-align:center;cursor:pointer;color:var(--mute);transition:border-color .15s,background .15s}
.drop:hover,.drop.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.drop b{color:var(--ink);display:block;font-weight:500}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.card{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover{border-color:var(--acc)}
.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:contain}
.card span{display:block;padding:6px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.na{border-style:dashed;cursor:help}.card.na i{display:block;padding:14px 8px 0;font-style:normal;font-size:12px;color:var(--mute)}
.card .x,.row .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px}
.card .x{position:absolute;top:2px;right:2px;background:var(--panel);border-radius:6px}
.row{display:flex;align-items:center;border-radius:6px;padding:2px 2px 2px 8px}
.row.sel{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.row button.n{flex:1;text-align:left;border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row button.up,.row button.dn{border:0;background:none;color:var(--mute);cursor:pointer;font-size:12px;padding:2px 4px;line-height:1}
.row button.up:hover,.row button.dn:hover{color:var(--acc)}

#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.hint,.toast{position:absolute;left:50%;transform:translateX(-50%);background:rgba(28,27,24,.82);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;max-width:86%;text-align:center;pointer-events:none}
.hint{bottom:14px}.toast{top:14px;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
label.f{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
input[type=text],select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:58px;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;font-size:11.5px;text-align:center}
.sw i{display:block;height:44px;border-radius:7px;border:1px solid rgba(0,0,0,.18);margin-bottom:4px;outline:2px solid transparent;outline-offset:2px}
.sw.on i{outline-color:var(--acc)}
.sw.orig i{background:repeating-linear-gradient(45deg,var(--bg) 0 5px,var(--line) 5px 6px)}
.wg i{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px 3px)}
.vel i{background-image:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),transparent 62%)}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.btns button:hover{border-color:var(--acc)}
.empty{color:var(--mute)}
.app{grid-template-areas:"left stage side"}#left{grid-area:left}.stage{grid-area:stage}#side{grid-area:side}
@media(min-width:1021px){.stage,#side{position:sticky;top:14px}#side{max-height:calc(100vh - 28px);overflow:auto}}
@media(max-width:1020px){.app{grid-template-columns:minmax(0,1fr) 280px;grid-template-areas:"stage side" "left left"}}
@media(max-width:640px){.app{grid-template-columns:1fr;grid-template-areas:"stage" "side" "left"}}
details.cal{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.cal summary{cursor:pointer;font-weight:700;font-size:13px}
.btns{flex-wrap:wrap}.btns button{flex:1 1 40%}

@media (max-width: 900px){
  .app{grid-template-columns:1fr;gap:8px;padding:8px}
  .panel{padding:12px}
  #side{order:3}
  .stage{aspect-ratio:4/3;min-height:50vh}
  .btns button,.drop{font-size:15px;padding:12px}
  .row button.up,.row button.dn,.row .x{font-size:18px;padding:8px}
}
.cam-btn{position:absolute;top:12px;right:12px;z-index:10;background:var(--acc);color:var(--accink);border:0;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none}
#gl{z-index:1}
.ar-controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;display:none;gap:8px}
.ar-controls.on{display:flex}
.ar-controls button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}

.wand-btn{position:absolute;top:12px;right:72px;z-index:10;height:48px;padding:0 18px 0 14px;border:0;border-radius:24px;background:var(--acc);color:var(--accink);display:flex;align-items:center;gap:8px;font:inherit;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.wand-btn svg{width:22px;height:22px;flex:none}
@media(max-width:520px){.wand-btn{width:48px;padding:0;justify-content:center}.wand-btn span{display:none}}
.msvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.rt-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.rt-modal[hidden]{display:none}
.rt-box{background:var(--panel);color:var(--ink);border-radius:14px;padding:14px;width:min(1100px,100%);max-height:100%;overflow:auto}
.rt-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.rt-head b{font-size:16px;flex:1}
.rt-x{border:0;background:none;color:var(--ink);font-size:28px;cursor:pointer;line-height:1;padding:0 6px}
.rt-view{position:relative;width:min(100%,calc(62vh*var(--rar,1.7778)));aspect-ratio:var(--rar,1.7778);margin:0 auto;border-radius:8px;overflow:hidden;background:#000}
.rt-view canvas{position:absolute;inset:0;width:100%;height:100%}
.rt-line{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none;display:none}
.rt-tag{position:absolute;top:8px;padding:3px 9px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;pointer-events:none}.rt-tag.l{left:8px}.rt-tag.r{right:8px}
#rtreport{font-size:12.5px;margin-top:10px}
</style>
</head>
<body>
<div class="app">
 <aside class="panel" id="left">
  <h1>Sofa-Konfigurator</h1>
  <label class="drop" id="drop"><b>Sofa-Modelle</b>.glb / .gltf hierher ziehen oder auswählen
   <input id="file" type="file" multiple accept=".glb,.gltf,.max" hidden></label>
  <label class="drop" id="dropdeko" style="margin-top:10px"><b>Deko, Teppiche, Pflanzen</b> PNG / JPG hochladen
   <input id="filedeko" type="file" multiple accept="image/png,image/jpeg,image/webp" hidden></label>
  <label class="f">Einheit der Dateien</label>
  <select id="unit"><option value="auto">Automatisch erkennen</option><option value="1">Meter</option><option value="0.01">Zentimeter</option><option value="0.001">Millimeter</option></select>
  <div class="lib" id="lib"></div>
  <h2>Google Drive</h2>
  <label class="f">API-Key (für öffentlichen Ordner)</label>
  <input id="drivekey" type="password" placeholder="Google API Key" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit">
  <button id="loaddrive" style="margin-top:6px;width:100%">Ordner laden</button>
  <div id="drivelist" class="lib" style="margin-top:8px"></div>
  <h2>Hintergrund</h2>
  <div class="btns" style="margin-top:0"><button id="bgbtn">Bild hochladen</button><button id="bgreset">Standard</button></div>
  <div class="btns" style="margin-top:8px"><button id="dlpng">Als PNG speichern</button><button id="dljpg">Als JPG speichern</button></div>
  <input id="bgfile" type="file" accept="image/*" hidden>
  <h2>Im Raum</h2>
  <div id="list"><div class="empty">Noch nichts platziert.</div></div>
  <details class="cal"><summary>Raum und Licht</summary><div id="cal"></div></details>
 </aside>
 <main class="stage" id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="gl"></canvas>
  <button class="cam-btn" id="cambtn" title="Live-Kamera / AR">📷</button>
  <button class="wand-btn" id="wandbtn" title="KI Retusche: Sofa per Knopfdruck in das Foto einarbeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L15 9"/><path d="M13.5 7.5l3 3"/><path d="M17 3v3M15.5 4.5h3M20 9v2M19 10h2M8 4v2M7 5h2"/></svg><span>KI Retusche</span></button>
  <svg class="msvg" id="msvg"></svg>
  <div class="ar-controls" id="arcontrols">
    <button id="capture">Foto aufnehmen</button>
    <button id="stopcam">Kamera schließen</button>

function downloadView(fmt){
  need = true;
  renderer.render(scene, cam); // frischen Frame erzwingen
  const mime = fmt === 'jpg' ? 'image/jpeg' : 'image/png';
  const ext = fmt === 'jpg' ? 'jpg' : 'png';
  const quality = fmt === 'jpg' ? 0.92 : undefined;
  const w = cv.width, h = cv.height;
  const out = document.createElement('canvas');
  out.width = w;
  out.height = h;
  const ctx = out.getContext('2d');

  function finish(){
    const data = out.toDataURL(mime, quality);
    const a = document.createElement('a');
    a.href = data;
    a.download = 'sofa-konfiguration.' + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Sofa + Hintergrund als ' + ext.toUpperCase() + ' gespeichert');
  }

  const bg = getComputedStyle(stage).backgroundImage;
  const m = bg && bg.match(/url\(["']?(.*?)["']?\)/);
  if (m && m[1]) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const ir = img.width / img.height;
      const cr = w / h;
      let dw = w, dh = h, dx = 0, dy = 0;
      if (ir > cr) { dh = h; dw = h * ir; dx = (w - dw) / 2; }
      else { dw = w; dh = w / ir; dy = (h - dh) / 2; }
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.drawImage(cv, 0, 0, w, h); // 3D-Szene darüber
      finish();
    };
    img.onerror = () => {
      ctx.fillStyle = getComputedStyle(stage).backgroundColor || '#cfcac0';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(cv, 0, 0, w, h);
      finish();
    };
    img.src = m[1];
  } else {
    ctx.fillStyle = getComputedStyle(stage).backgroundColor || '#cfcac0';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(cv, 0, 0, w, h);
    finish();
  }
}

// === Google Drive ===
const DRIVE_FOLDER = '1Ca13g2NydyVqHsktQd5a8rw4nZsgcIX_';
$('#loaddrive').onclick = async () => {
  const key = $('#drivekey').value.trim();
  if (!key) { toast('Bitte Google API Key eingeben (für öffentlichen Ordner)'); return; }
  try {
    const url = `https://www.googleapis.com/drive/v3/files?q='${DRIVE_FOLDER}'+in+parents&key=${key}&fields=files(id,name,mimeType)`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const list = $('#drivelist');
    list.innerHTML = '';
    (data.files || []).forEach(f => {
      if (!/\.(glb|gltf)$/i.test(f.name)) return;
      const b = document.createElement('div');
      b.className = 'card';
      b.innerHTML = `<span>${f.name}</span>`;
      b.onclick = () => loadFromDrive(f.id, f.name, key);
      list.appendChild(b);
    });
    if (!list.children.length) toast('Keine .glb/.gltf Dateien im Ordner gefunden');
  } catch (e) { toast('Drive-Fehler: ' + e.message); }
};
async function loadFromDrive(id, name, key) {
  toast('Lade ' + name + ' …');
  try {
    const url = `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${key}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const buf = await res.arrayBuffer();
    const file = new File([buf], name);
    handleFiles([file]);
  } catch (e) { toast('Download fehlgeschlagen: ' + e.message); }
}

let stream = null;
const video = $('#video');
$('#cambtn').onclick = async () => {
  if (stream) { stopCam(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = stream;
    video.style.display = 'block';
    $('#arcontrols').classList.add('on');
    renderer.setClearColor(0x000000, 0); // transparent
    toast('Live-Kamera aktiv – Sofa erscheint über dem Raum');

function stopCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.style.display = 'none';
  $('#arcontrols').classList.remove('on');
  renderer.setClearColor(0x000000, 0);
}
$('#stopcam').onclick = stopCam;
$('#capture').onclick = () => {

 toast('Maßstab angepasst (Kamerahöhe '+cal.h+' cm). Das Sofa behält seine echte Größe.');retouch()}
$('#wandbtn').onclick=()=>retouch().catch(e=>{RT.busy=false;toast('Retusche fehlgeschlagen: '+e.message)});
$('#rtclose').onclick=()=>{$('#rt').hidden=true};$('#rtagain').onclick=()=>{$('#rt').hidden=true;$('#wandbtn').click()};
$('#rtscale').onclick=startMeasure;$('#rtpng').onclick=()=>saveRT('png');$('#rtjpg').onclick=()=>saveRT('jpg');
$('#rtk').oninput=applyRT;$('#rtcmp').oninput=applyRT;
addEventListener('keydown',e=>{if(e.key==='Escape'){$('#rt').hidden=true;if(meas){meas=null;msvg.innerHTML='';stage.style.cursor=''}}});

addEventListener('error',e=>toast('Fehler: '+e.message));addEventListener('unhandledrejection',e=>toast('Fehler: '+(e.reason&&e.reason.message||e.reason)));
// Kalibrierung Raum & Licht
$('#cal').innerHTML='<div class="empty" style="font-size:12px">Sonnenrichtung: 0° Licht von rechts, 90° von vorn, 180° von links, 270° von hinten.</div>'+CALS.map(c=>`<label class="f">${c[1]}: <span id="c_${c[0]}">${cal[c[0]]}</span> ${c[4]}</label><input type="range" data-k="${c[0]}" min="${c[2]}" max="${c[3]}" value="${cal[c[0]]}">`).join('');
$('#cal').querySelectorAll('input').forEach(i=>i.oninput=()=>{tuned=true;cal[i.dataset.k]=+i.value;$('#c_'+i.dataset.k).textContent=i.value;if(['hor','h','fov'].includes(i.dataset.k))showGrid();applyCal()});
function syncCal(){$('#cal').querySelectorAll('input').forEach(i=>{i.value=cal[i.dataset.k];$('#c_'+i.dataset.k).textContent=cal[i.dataset.k]})}
function applyCal(){const r=stage.getBoundingClientRect();cam.fov=cal.fov;cam.aspect=r.width/r.height;cam.position.set(0,cal.h/100,0);
 cam.setViewOffset(r.width,r.height,0,-(cal.hor/100-.5)*r.height,r.width,r.height);cam.updateProjectionMatrix();
 renderer.toneMappingExposure=cal.exp/100;const a=cal.sun*Math.PI/180,e=cal.sunE*Math.PI/180,R=9;
 sun.position.set(R*Math.cos(e)*Math.cos(a),R*Math.sin(e),-4.5+R*Math.cos(e)*Math.sin(a));
 sun.intensity=1.6*lightK*cal.sunI/100;ground.material.opacity=cal.sh/100;items.forEach(setMir);need=true}
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);applyCal()}
new ResizeObserver(resize).observe(stage);resize();drawSide();
(function loop(){requestAnimationFrame(loop);if(need){need=false;renderer.render(scene,cam)}})();
</script>
